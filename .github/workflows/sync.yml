name: 평가계획 자동 동기화

on:
  schedule:
    # 매일 06:10 KST (UTC 21:10) — 학교에 새 평가계획이 올라왔는지 확인한다.
    - cron: '10 21 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: '수집할 학년도 (예: 2026)'
        required: false
        default: '2026'

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 학교 평가계획 수집
        run: python scripts/sync.py --year "${{ github.event.inputs.year || '2026' }}"

      - name: 변경이 있을 때만 커밋
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "학교 평가계획 자동 동기화 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git push
            echo "### 평가계획이 갱신되었습니다" >> $GITHUB_STEP_SUMMARY
          else
            echo "변경 없음 — 커밋하지 않습니다."
            echo "### 변경 없음" >> $GITHUB_STEP_SUMMARY
          fi
